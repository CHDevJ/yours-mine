# 테스트용 H2 프로필: src/main/resources 의 같은 이름 파일 대신 이 파일이 쓰인다.
# 개발용 DB(./local-data)를 건드리지 않도록 메모리 DB를 쓰고, 업로드 파일도 target/ 아래에 둔다.
# MySQL로 테스트하려면: ./mvnw test -Dspring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:yoursmine-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
app.upload-dir=./target/test-uploads
