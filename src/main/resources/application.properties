#spring.application.name=market

# DB는 프로필로 고른다. 프로필을 지정하지 않으면 h2(설치 없이 바로 실행)를 쓴다.
#   h2    : application-h2.properties    (파일형 H2, ./local-data/)
#   mysql : application-mysql.properties (Docker MySQL)
spring.profiles.default=h2

# 개발용: 엔티티 기준으로 테이블을 자동 생성/갱신하고, 테이블이 만들어진 뒤 data.sql 실행
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# 상품 이미지 저장 폴더. 환경 변수 UPLOAD_DIR 로 바꿀 수 있다. 상대 경로는 실행 위치(프로젝트 루트) 기준.
app.upload-dir=${UPLOAD_DIR:./local-data/uploads}

logging.level.org.hibernate.SQL=DEBUG
logging.level.com.My=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true

mybatis.type-aliases-package=com.My.market.model
#change
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/**/*.xml

spring.servlet.multipart.maxFileSize=10MB
spring.servlet.multipart.maxRequestSize=10MB
