<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/common :: head('채팅 목록')}">
    <meta charset="UTF-8">
    <title>채팅 목록</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:replace="~{fragments/common :: menu('chat')}"></nav>

    <div class="container mt-4">
        <h4>내 채팅</h4>

        <p class="text-muted" th:if="${#lists.isEmpty(rooms)}">
            아직 채팅이 없습니다. 상품 상세 페이지에서 '연락하기'를 눌러 시작해 보세요.
        </p>

        <div class="list-group" th:unless="${#lists.isEmpty(rooms)}">
            <a class="list-group-item list-group-item-action" th:each="r : ${rooms}"
                th:attr="data-room-id=${r.roomId}" th:href="@{/chat/room/{id}(id=${r.roomId})}">
                <div class="d-flex justify-content-between">
                    <strong th:text="${r.boardTitle}">상품명</strong>
                    <span>
                        <!-- 안 읽은 메시지가 있을 때만 보이는 빨간 배지 (알림이 오면 JS 가 값을 바꾼다) -->
                        <span class="badge bg-danger unread-badge" th:classappend="${r.unreadCount == 0} ? 'd-none'"
                            th:text="${r.unreadCount > 99} ? '99+' : ${r.unreadCount}">3</span>
                        <span class="badge" th:classappend="${r.seller} ? 'bg-primary' : 'bg-secondary'"
                            th:text="${r.seller} ? '판매' : '구매'">구매</span>
                    </span>
                </div>
                <small class="text-muted">상대방: <span th:text="${r.otherName}">상대</span></small>
            </a>
        </div>

        <a class="btn btn-dark mt-3" th:href="@{/board/list}">상품 목록</a>
    </div>

    <script>
        // 알림 소켓(공통 footer)에서 새 메시지 알림이 오면 해당 방의 배지를 바꾼다.
        // 목록에 없는 방이면(새로 생긴 방) 목록을 다시 불러온다.
        window.onChatNotify = function (data) {
            var row = document.querySelector('[data-room-id="' + data.roomId + '"]');
            if (!row) {
                if (data.roomUnreadCount > 0) location.reload();
                return;
            }
            var badge = row.querySelector('.unread-badge');
            badge.textContent = data.roomUnreadCount > 99 ? '99+' : data.roomUnreadCount;
            badge.classList.toggle('d-none', data.roomUnreadCount === 0);
        };
    </script>

    <footer th:replace="~{fragments/common :: footer}"></footer>
</body>

</html>
