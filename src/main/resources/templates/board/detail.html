<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<link th:href="@{/css/detail.css}" rel="stylesheet" />

<head th:replace="~{fragments/common :: head('상품정보')}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="navbars-offcanvas.css" th:href="@{/css/navbars-offcanvas.css}" rel="stylesheet">
    <title>상품정보</title>
</head>

<body>
    <div>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Offcanvas navbar large"
            th:replace="~{fragments/common :: menu('detail')}">
        </nav>
    </div>
    <div class="container">
        <div class="wrap">
            <main>
                <div class="product-detail">
                    <img th:src="@{|/upload/${boardDetail.storedFileName}|}" class="detailImage" alt="제품 사진">
                    <hr class="one" />
                    <div class="product-overview">
                        <h2 th:text="${boardDetail.title}" class="board_title" style="margin-top: 0px">제품 이름입니다
                        </h2>
                        <div class="section-bar"></div>
                        <h6 th:text="|${#numbers.formatInteger(boardDetail.price, 1, 'COMMA')}원|" id="product-price"
                            class="board_price">제품
                            가격입니다</h6>

                        <section class="button-list">
                            <!-- <button type="button" class="btn btn-secondary">
                                <span class="button-span-1">찜하기</span>
                            </button> -->
                            <a th:href="@{/chat/chatList}">
                                <button type="button" class="btn btn-info" sec:authorize="hasRole('ROLE_ADMIN')">
                                    <span class="button-span-1">관리자 채팅</span>
                                </button>
                            </a>

                            <!-- 구매자: (상품, 나) 채팅방을 만들거나 기존 방으로 이동 -->
                            <form th:action="@{/chat/start}" method="post" style="display:inline"
                                th:unless="${isSell} or ${isOwner}">
                                <input type="hidden" name="boardId" th:value="${boardDetail.id}">
                                <button type="submit" id="chatbtn" class="btn btn-info"
                                    sec:authorize="hasRole('ROLE_USER')">
                                    <span class="button-span-1">연락하기</span>
                                </button>
                            </form>

                            <!-- 판매자: 내 채팅 목록으로 이동 -->
                            <a th:href="@{/chat/chatList}" th:if="${isOwner}">
                                <button type="button" class="btn btn-info">
                                    <span class="button-span-1">채팅 목록</span>
                                </button>
                            </a>

                            <button type="button" class="btn btn-primary" th:unless="${isSell}">판매중</button>
                            <button type="button" class="btn btn-danger" th:if="${isSell}">판매완료</button>
                            <!-- <button type="button" class="btn btn-danger" th:unless="${isOwner} and ${isSell}"
                            >찜</button> -->
                            <button type="button" class="btn btn-danger" th:unless="${isOwner} and ${isSell}"
                                th:if="${isLike}" th:onclick="|DisLike(${boardDetail.id})|">찜</button>
                        </section>
                        <div>
                            <hr class="one" />
                        </div>
                        <div class="product-description">
                            <p class="product-buyer-span">제품 상세 설명</p>
                            <span th:text="${boardDetail.content}" class="content">제품설명</span>
                            <div class="section-bar"></div>
                        </div>

                        <div th:if="${isOwner}">
                            <hr class="one" />
                            <p class="product-buyer-span">제품 상태 변경</p>
                            <button type="button" class="btn btn-secondary" th:if="${isOwner}"
                                th:onclick="|turn1(${boardDetail.id})|">판매중</button>
                            <button type="button" class="btn btn-secondary" th:if="${isOwner}"
                                th:onclick="|turn0(${boardDetail.id})|">판매완료</button>
                        </div>

                        <div class="btn-area">
                            <hr class="one" />
                            <button type="button" class="btn btn-danger" th:if="${isOwner}"
                                th:onclick="|deleteBoard(${boardDetail.id})|">상품삭제</button>

                            <a th:href="@{/board/form(id=${boardDetail.id})}">
                                <button type="button" class="btn btn-primary" th:if="${isOwner}">
                                    <span class="button-list">상품수정</span>
                                </button>
                            </a>

                            <button type="button" class="btn btn-danger" sec:authorize="hasRole('ROLE_ADMIN')"
                                th:onclick="|deleteBoardAdmin(${boardDetail.id})|">관리자의 권한으로 삭제</button>
                            <button type="button" class="btn btn-danger" th:unless="${isOwner} or ${isSell} or ${isLike}"
                                th:onclick="|YesLike(${boardDetail.id})|">찜하기</button>

                            <!-- <button type="button" class="btn btn-danger" th:unless="${isOwner}"
                                th:onclick="|YesLike(${boardDetail.id})|">찜하기</button> -->

                            <a th:href="@{/board/list}">
                                <button type="button" class="btn btn-dark">
                                    <span class="button-list">목록</span>
                                </button>
                            </a>

                        </div>

                        <br>
                        <br>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <footer th:replace="~{fragments/common :: footer}"></footer>
    <script>
        function deleteBoard(id) {
            $.ajax({
                url: '/api/boards/' + id,
                type: 'DELETE',
                success: function (result) {
                    console.log('result', result);
                    alert('상품이 삭제됐습니다.');
                    window.location.href = '/account/mypage';
                }
            });
        }
        function deleteBoardAdmin(id) {
            $.ajax({
                url: '/api/boards/admin/' + id,
                type: 'DELETE',
                success: function (result) {
                    console.log('result', result);
                    alert('상품이 삭제됐습니다.');
                    window.location.href = '/board/list';
                }
            });
        }

        function alertMsg() {
            alert('회원가입되었습니다.');
        }

        function turn1(id) {
            $.ajax({
                url: '/board/SellState.ajax',
                data: {
                    num: 1,
                    Bid: id
                },
                type: 'POST',
                success: function (data) {
                    alert('판매 중인 상품으로 변경되었습니다.');
                    window.location.href = '/board/detail/' + id;
                },
                error: function () {
                    alert('에러');
                }
            })
        }
        function turn0(id) {
            $.ajax({
                url: '/board/SellState.ajax',
                data: {
                    num: 0,
                    Bid: id
                },
                type: 'POST',
                success: function (data) {
                    alert('판매 완료된 상품으로 변경되었습니다.');
                    window.location.href = '/board/detail/' + id;
                },
                error: function () {
                    alert('에러');
                }
            })
        }

        function YesLike(id) {
            $.ajax({
                url: '/board/LikeState.ajax',
                data: {
                    num: 1,
                    Bid: id
                },
                type: 'POST',
                success: function (data) {
                    alert('상품을 찜 했습니다.');
                    window.location.href = '/board/detail/' + id;
                },
                error: function () {
                    alert('에러');
                }
            })
        }

        function DisLike(id) {
            $.ajax({
                url: '/board/LikeState.ajax',
                data: {
                    num: 0,
                    Bid: id
                },
                type: 'POST',
                success: function (data) {
                    alert('찜하기가 취소 되었습니다.');
                    window.location.href = '/board/detail/' + id;
                },
                error: function () {
                    alert('에러');
                }
            })
        }
    </script>
</body>

</html>
