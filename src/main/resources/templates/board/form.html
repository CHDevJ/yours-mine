<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/common :: head('상품등록')}">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="navbars-offcanvas.css" th:href="@{/css/navbars-offcanvas.css}" rel="stylesheet">
  <title>상품등록</title>
</head>

<body>
  <main>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Offcanvas navbar large"
      th:replace="~{fragments/common :: menu('board')}">
    </nav>

    <div class="container">
      <br>
      <h2 style="font-weight: bold;">상품 등록</h2>
      <form action="#" th:action="@{/board/form}" th:object="${board}" method="post" , enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{Fid}">
        <div class="mb-3">
          <label for="title" class="form-label">상품명</label>
          <input type="text" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
            id="title" th:field="*{title}">
          <div id="validationServer03Feedback" class="invalid-feedback" th:if="${#fields.hasErrors('title')}"
            th:errors="*{title}">
            상품명 에러 메시지.
          </div>
        </div>
        <div class="mb-3">
          <label for="content" class="form-label">설명</label>
          <textarea class="form-control" id="content" rows="3" th:field="*{content}"
            th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"></textarea>
          <div id="validationServer03Feedback" class="invalid-feedback" th:if="${#fields.hasErrors('content')}"
            th:errors="*{content}">
            설명 에러 메시지.
          </div>
        </div>

        <div class="mb-3">
          <label for="price" class="form-label">가격</label>
          <input type="text" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
            id="price" th:field="*{price}">
          <div id="validationServer03Feedback" class="invalid-feedback" th:if="${#fields.hasErrors('price')}"
            th:errors="*{price}">
            가격 에러 메시지.
          </div>
          <br>
          <br>
        </div>
        <div class="mb-3">
          <label for="multipartFile">상품사진</label>
          상품 이미지 업로드 : <input type="file" id="multipartFile" class="form-control" th:field="*{multipartFile}">
        </div>

        <div class="text-end">
          <a class="btn btn-primary" th:href="@{/board/list}">취소</a>
          <button type="submit" class="btn btn-primary" id="registProd" disabled th:onclick="|state()|">상품 등록</button>
        </div>
      </form>
    </div>
  </main>
  <footer th:replace="~{fragments/common :: footer}"></footer>
  <script>
    function deleteBoard(id) {
      $.ajax({
        url: '/api/boards/' + id,
        type: 'DELETE',
        success: function (result) {
          console.log('result', result);
          alert('상품이 삭제됐습니다.');
          window.location.href = '/board/list';
        }
      });
    }
    function state(){
      alert('마이페이지에서 상품의 상품의 판매상태를 알려주세요!')
    }

    $(document).ready(function () {
      $("#multipartFile").on("focusout", function () {

        var mf = document.getElementById("multipartFile").value;

        if (!mf) {
          document.getElementById('registProd').setAttribute('disabled', true);
          return false;
        }
        else {
          document.getElementById('registProd').removeAttribute("disabled");
        }
      });
    })
  </script>
</body>

</html>
