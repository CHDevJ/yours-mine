<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="navbars-offcanvas.css" th:href="@{/css/navbars-offcanvas.css}" rel="styles">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Offcanvas navbar large"
        th:fragment="menu(menu)">

        <div class="container-fluid">
            <a class="navbar-brand" href="#" th:href="@{/home}">Yours & Mine</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar2"
                aria-controls="offcanvasNavbar2" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasNavbar2"
                aria-labelledby="offcanvasNavbar2Label">
                <ul class="navbar-nav justify-content-start flex-grow-1 pe-3">
                    <li class="nav-item" th:classappend="${menu} == 'home'? 'active'">
                        <a class="nav-link" href="#" th:href="@{/home}">홈 <span class="visually-hidden"
                                th:if="${menu} == 'home'">current</span></a>
                    </li>

                    <li class="nav-item" th:classappend="${menu} == 'board'? 'active'">
                        <a class="nav-link" href="#" th:href="@{/board/list}">상점 <span class="visually-hidden"
                                th:if="${menu} == 'board'">current</span></a>
                    </li>

                    <li class="nav-item" th:classappend="${menu} == 'mypage'? 'active'" sec:authorize="hasRole('ROLE_USER')">
                        <a class="nav-link" href="#" th:href="@{/account/mypage}">마이페이지 <span class="visually-hidden"
                                th:if="${menu} == 'mypage'">current</span></a>
                    </li>

                    <li class="nav-item" th:classappend="${menu} == 'pick'? 'active'" sec:authorize="hasRole('ROLE_USER')">
                        <a class="nav-link" href="#" th:href="@{/account/pick}">찜목록 <span class="visually-hidden"
                                th:if="${menu} == 'mypage' or ${menu} == 'pick'">current</span></a>
                    </li>

                    <li class="nav-item" th:classappend="${menu} == 'chat'? 'active'" sec:authorize="hasRole('ROLE_USER')">
                        <a class="nav-link" href="#" th:href="@{/chat/chatList}">채팅 <span class="visually-hidden"
                                th:if="${menu} == 'chat'">current</span></a>
                    </li>
                </ul>
            </div>
            <!-- <div class="d-grid gap-2 d-md-block"> -->
            <a class="btn btn-secondary my-2 mr-2 my-sm-0" th:href="@{/account/login}"
                sec:authorize="!isAuthenticated()">로그인</a>
            <a class="btn btn-secondary my-2 ms-2 my-sm-0" th:href="@{/account/register}"
                sec:authorize="!isAuthenticated()">회원가입</a>

            <form class="form-inline my-2 my-lg-0" th:action="@{/logout}" method="POST"
                sec:authorize="isAuthenticated()">
                <span class="text-white ms-2" sec:authentication="name">사용자</span>
                <span class="text-white mx-2" sec:authentication="principal.authorities">권한</span>
                <button class="btn btn-secondary my-2 my-sm-0" type="submit">로그아웃</button>
            </form>
            <!-- </div> -->
        </div>
    </nav>

    <footer th:fragment="footer">
        <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
          integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
          crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
          integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
          crossorigin="anonymous"></script>
      </footer>
</body>

</html>
