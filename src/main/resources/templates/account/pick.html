<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" href="/css/product_list.css">

<head th:replace="~{fragments/common :: head('상점')}">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="navbars-offcanvas.css" th:href="@{/css/navbars-offcanvas.css}" rel="stylesheet">

  <title>마이페이지</title>
</head>

<body>
  <div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Offcanvas navbar large"
      th:replace="~{fragments/common :: menu('pick')}">
    </nav>
  </div>
  <main>
    <div class="container">
      <br>
      <br>
      <h2 style="font-weight: bold;">내가 찜한 상품</h2>
      <!-- <form class="row g-3 d-flex justify-content-end" method="GET" th:action="@{/account/pick}">
        <div class="col-auto">
          <label for="searchText" class="visually-hidden">검색</label>
          <input type="text" class="form-control" id="searchText" name="searchText" th:value="${param.searchText}">
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-dark">검색</button>
        </div>
      </form> -->
      <div>
        <ul class="product_list">
          <li th:each="board : ${boards}" class="card">
            <a th:href="@{/board/detail/{id}(id=${board.id})}" style="text-decoration-line:none">
              <div class="product_img_container">
                <img th:src="@{|/upload/${board.storedFileName}|}" class="product_img" alt="제품 사진">
              </div>
              <div class="card_container">
                <p th:text="${board.title}" class="board_title">제품 이름입니다</p>
                <p th:text="|${#numbers.formatInteger(board.price, 1, 'COMMA')}원|" class="board_price"><b>제품 가격입니다.</b>
                </p>
              </div>
          </li>
        </ul>
      </div>
      <br>
      <br>
      <br>
      <div>
        <nav aria-label="Page navigation example">
          <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${1 == boards.pageable.pageNumber + 1} ? 'disabled'">
              <a class="page-link"
                th:href="@{/account/pick(page=${boards.pageable.pageNumber - 1}, searchText=${param.searchText})}">Previous</a>
            </li>
            <li class="page-item" th:classappend="${i == boards.pageable.pageNumber + 1} ? 'disabled'"
              th:each="i : ${#numbers.sequence(startPage, endPage)}">
              <a class="page-link" href="#" th:href="@{/account/pick(page=${i - 1}, searchText=${param.searchText})}"
                th:text="${i}" style="color: black;" >1</a>
            </li>
            <li class="page-item" th:classappend="${boards.totalPages == boards.pageable.pageNumber + 1} ? 'disabled'">
              <a class="page-link" href="#"
                th:href="@{/account/pick(page=${boards.pageable.pageNumber + 1}, searchText=${param.searchText})}">Next</a>
            </li>
          </ul>
        </nav>
      </div>
      <br>
      <br>
      <br>
      <br>
    </div>
  </main>
  <footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
