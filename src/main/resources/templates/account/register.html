<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/LogIn.css}" rel="stylesheet">
    <title>Signin</title>
</head>

<body class="text-center">
    <section class="forms-section">
        <br>
        <br>
        <a th:href="@{/home}">
            <h1 class="section-title">Yours & Mine</h1>
        </a>
        <div class="forms">
            <div class="form-wrapper is-active">
                <button type="button" class="switcher switcher-signup">
                    회원가입
                    <span class="underline"></span>
                </button>

                <form class="form form-signup" th:action="@{/account/register}" method="post">
                    <fieldset>
                        <legend>아이디와 패스워드를 입력해주세요.</legend>

                        <div class="input-block">
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="Username">
                            <label id="label1">아이디</label>
                        </div>

                        <div class="input-block">
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Password">
                            <label pw="label2">패스워드</label>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn-signup" id="signup" th:onclick="|alertMsg()|" disabled>회원
                        가입</button>
                </form>
            </div>
        </div>
    </section>
    <footer th:replace="~{fragments/common :: footer}"></footer>

    <script>
        $(document).ready(function () {
            //ID 중복 확인
            //id를 입력할 수 있는 input text 영역을 벗어나면 동작한다.
            $("#username").on("focusout", function () {

                var id = $("#username").val();

                if (id == '' || id.length == 0) {
                    $("#label1").css("color", "red").text("공백은 ID로 사용할 수 없습니다.");
                    return false;
                }

                //Ajax로 전송
                $.ajax({
                    url: '/api/users/ConfirmId',
                    data: {
                        username: id
                    },
                    type: 'POST',
                    dataType: 'json',
                    success: function (result) {
                        if (result == true) {
                            $("#label1").css("color", "black").text("사용 가능한 ID 입니다.");
                        } else {
                            $("#label1").css("color", "red").text("사용 불가능한 ID 입니다.");
                            $("#username").val('');
                        }
                    }
                }); //End Ajax
            });
        })

        $(document).ready(function () {
            $("#password").on("focusout", function () {

                var pw = $("#password").val();

                if (!(pw == '' || pw.length == 0)) {
                    document.getElementById('signup').removeAttribute("disabled"); 
                }
                else {
                    document.getElementById('signup').setAttribute('disabled',true);
                    return false;
                }
            });
        })

    </script>
</body>

</html>
