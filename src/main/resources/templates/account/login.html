<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/LogIn.css}" rel="stylesheet">
    <title>Login</title>
</head>

<body class="text-center">
    <section class="forms-section">
        <br>
        <br>
        <a th:href="@{/home}">
            <h1 class="section-title">Yours & Mine</h1>
        </a>
        <div class="forms">
            <div class="form-wrapper is-active">
                <button type="button" class="switcher switcher-login">
                    로그인
                    <span class="underline"></span>
                </button>

                <form class="form form-login" th:action="@{/account/login}" method="post">
                    <fieldset>
                        <legend>아이디와 비밀번호를 입력해주세요.</legend>
                        <div th:if="${param.error}" class="alert alert-danger" role="alert">
                            유효하지 않은 아이디 혹은 패스워드입니다.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success" role="alert">
                            로그아웃 되었습니다.
                        </div>
                        <div class="input-block">
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="Username">
                            <label for="username">아이디</label>
                        </div>
                        <div class="input-block">
                            <input type="password" class="form-control" id="floatingPassword" name="password"
                                placeholder="Password">
                            <label for="floatingPassword">패스워드</label>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn-login">로그인</button>

                    <a th:href="@{/account/register}">
                        <button type="button" class="btn-log">회원가입</button>
                    </a>
                </form>
            </div>

        </div>
    </section>
