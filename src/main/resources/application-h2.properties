# H2 프로필(기본값): 설치 없이 바로 실행된다. 데이터는 ./local-data/yoursmine.mv.db 에 남는다.
# MODE=MySQL           : INSERT IGNORE 등 MySQL 문법을 그대로 쓰기 위해
# DATABASE_TO_LOWER    : 테이블·컬럼 이름을 MySQL처럼 소문자로
# NON_KEYWORDS=USER    : H2에서 예약어인 user 를 테이블 이름으로 쓰기 위해
spring.datasource.url=jdbc:h2:file:./local-data/yoursmine;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
